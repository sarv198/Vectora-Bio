<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- vectora-bio favicon: a cell (membrane + nucleus) being injected with a drug. -->
  <rect width="32" height="32" rx="5" fill="#161D27"/>
  <!-- cell -->
  <circle cx="13" cy="19" r="9.4" fill="#6B9BB8" fill-opacity="0.2" stroke="#6B9BB8" stroke-width="2"/>
  <circle cx="11.2" cy="20.8" r="3.5" fill="#6B9BB8"/>
  <!-- syringe: plunger, barrel, needle -->
  <path d="M26.6 1.9 L30.1 5.4" stroke="#E6EAF0" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M28.3 3.7 L22.4 9.6" stroke="#E6EAF0" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M22.4 9.6 L17.4 14.6" stroke="#E6EAF0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the drug, released inside the cell -->
  <circle cx="16.1" cy="16" r="2.1" fill="#C6A46A"/>
</svg>
